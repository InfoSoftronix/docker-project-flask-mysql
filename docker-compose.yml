version: "3.9"

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: student
      FLASK_SECRET_KEY: supersecret
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
